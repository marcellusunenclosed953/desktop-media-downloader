name: Build And Publish Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release-tag.mjs

      - name: Verify source
        run: npm run check

      - name: Build app and installers
        run: npm run build:bundled

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/**/Desktop-Media-Downloader-Windows-*-Setup.exe
            release/**/Desktop-Media-Downloader-Windows-*-Setup.exe.blockmap
            release/**/Desktop-Media-Downloader-macOS-*.dmg
            release/**/Desktop-Media-Downloader-macOS-*.dmg.blockmap
            release/**/Desktop-Media-Downloader-Linux-*.AppImage
            release/**/latest*.yml
            release/**/builder-effective-config.yaml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/Desktop-Media-Downloader-Windows-*-Setup.exe
            release-assets/**/Desktop-Media-Downloader-Windows-*-Setup.exe.blockmap
            release-assets/**/Desktop-Media-Downloader-macOS-*.dmg
            release-assets/**/Desktop-Media-Downloader-macOS-*.dmg.blockmap
            release-assets/**/Desktop-Media-Downloader-Linux-*.AppImage
            release-assets/**/latest*.yml
